server {
    listen 80;
    server_name _;
    client_max_body_size 4k;
    error_page 413 =413 @body_too_large;
    error_page 502 504 =502 @api_unavailable;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve Docker service names again when containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        set $api_upstream api:5000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 7s;
    }

    location @api_unavailable {
        default_type application/json;
        return 502 '{"error":"API is unavailable"}';
    }

    location @body_too_large {
        default_type application/json;
        return 413 '{"error":"Requete trop volumineuse (4096 octets maximum)"}';
    }
}
